<!-- ══════════════════════════════════════════════════════════
     ★ TRANG LỘ TRÌNH (ROADMAP)
     Tách riêng để dễ chỉnh sửa.
     Được include từ dashboard.html
     ══════════════════════════════════════════════════════════ -->

<!-- ── Roadmap ── -->
<div class="page" id="page-roadmap">
  <div class="rm-root">

    <!-- Tab bar (pinned roadmaps + Cá nhân + nút Browse) -->
    <div class="rm-tabbar" id="rm-tabbar"></div>

    <!-- Stats pill (done/active/locked của roadmap đang xem) -->
    <div class="rm-stats-pill" id="rm-stats-pill"></div>

    <!-- Flow chính: spine + sections (main + nhánh trái/phải) -->
    <div class="rm-flow-scroll">
      <!-- Header cá nhân hoá — chỉ hiện ở tab "Lộ trình của tôi" -->
      <div class="rm-my-header" id="rm-my-header" style="display:none"></div>
      <div class="rm-flow-wrap" id="rm-flow-wrap"></div>
    </div>

    <!-- Cá nhân — hiện khi chọn tab "Cá nhân" (giữ nguyên canvas kéo-thả) -->
    <div id="roadmap-personal-view">
      <div class="rm-personal-hd">
        <div class="rm-personal-hd-left">
          <div class="rm-personal-icon">✏️</div>
          <div>
            <div class="rm-personal-label">Lộ trình cá nhân của tôi</div>
            <div class="rm-personal-sub">Kéo thả · Nhấn đúp để đổi tên · Click mũi tên để xóa</div>
          </div>
        </div>
        <div class="rm-personal-hd-right">
          <button class="rm-ai-btn" onclick="handlePersonalRoadmapAI()" title="Chỉ dành cho tài khoản Premium">
            🤖 Tạo bằng AI <span class="rm-premium-badge">Premium</span>
          </button>
          <button class="rm-save-btn" onclick="savePersonalRoadmap()">💾 Lưu lộ trình</button>
        </div>
      </div>

      <!-- Visual toolbar -->
      <div class="rmv-toolbar">
        <button class="rmv-btn rmv-btn-add" onclick="rmVAddNode()">
          <span>➕</span> Thêm node
        </button>
        <button class="rmv-btn rmv-btn-connect" id="rm-vbtn-connect" onclick="rmVToggleConnect()">
          <span>🔗</span> Nối node
        </button>
        <button class="rmv-btn rmv-btn-clear" onclick="rmVClearAll()">
          <span>🗑️</span> Xóa hết
        </button>
        <div class="rmv-hint" id="rm-vhint">Click "Thêm node" để bắt đầu</div>
        <div class="rmv-zoom-wrap">
          <button class="rmv-zoom-btn" onclick="rmVZoomOut()" title="Thu nhỏ (Ctrl+Scroll)">−</button>
          <span class="rmv-zoom-label" id="rm-vzoom-label">100%</span>
          <button class="rmv-zoom-btn" onclick="rmVZoomIn()" title="Phóng to (Ctrl+Scroll)">+</button>
          <button class="rmv-zoom-btn rmv-zoom-reset" onclick="rmVZoomReset()" title="Reset zoom">↺</button>
        </div>
      </div>

      <!-- Canvas -->
      <div id="rm-visual-canvas" tabindex="0">
        <div id="rm-vcontent">
          <svg id="rm-arrows-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>
    </div>

    <!-- Browse grid (26 lộ trình, pin/unpin) -->
    <div class="rm-browse-backdrop" id="rm-browse-backdrop" onclick="roadmapCloseBrowse()"></div>
    <div class="rm-browse" id="rm-browse" role="dialog" aria-label="Khám phá lộ trình">
      <div class="rm-browse-hd">
        <span class="rm-browse-title">Khám phá lộ trình</span>
        <button class="rm-browse-close" onclick="roadmapCloseBrowse()" aria-label="Đóng">
          <span data-icon="x" data-size="16"></span>
        </button>
      </div>
      <div class="rm-browse-search-wrap">
        <span data-icon="search" data-size="14" style="color:var(--t3)"></span>
        <input type="text" id="rm-browse-search" placeholder="Tìm lộ trình..." oninput="roadmapBrowseSearch(this.value)" autocomplete="off" />
      </div>
      <div class="rm-browse-list" id="rm-browse-list"></div>
    </div>

    <!-- Detail Drawer -->
    <div class="rm-drawer-backdrop" id="rm-drawer-backdrop" onclick="roadmapCloseDrawer()"></div>
    <div class="rm-drawer" id="rm-drawer" role="dialog" aria-label="Chi tiết node">
      <div class="rm-drawer-hd">
        <h2 id="rm-drawer-title">—</h2>
        <button class="rm-drawer-close" onclick="roadmapCloseDrawer()" aria-label="Đóng">
          <span data-icon="x" data-size="16"></span>
        </button>
      </div>
      <div class="rm-drawer-body">
        <div class="rm-drawer-status" id="rm-drawer-status"></div>
        <p class="rm-drawer-desc" id="rm-drawer-desc"></p>
        <div class="rm-drawer-resources" id="rm-drawer-resources"></div>
      </div>
    </div>

  </div>
</div>
