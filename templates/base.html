<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Programming EDU{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}landing-body{% endblock %}">
<div class="bg-canvas">
  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <div class="bg-blob b3"></div>
  <div class="bg-blob b4"></div>
</div>
<div class="grid-overlay"></div>
<div class="particles" id="landingParticles">
  <span class="particle particle-1"></span>
  <span class="particle particle-2"></span>
  <span class="particle particle-3"></span>
  <span class="particle particle-4"></span>
  <span class="particle particle-5"></span>
  <span class="particle particle-6"></span>
</div>

{% block nav %}
<nav class="landing-nav">
  <div class="landing-logo">
    <div class="logo-line1"><span class="blue">Pro</span><span class="blue">gram</span><span class="red">ming</span></div>
    <div class="logo-line2"><span class="blue">E</span><span class="blue">D</span><span class="red">U</span></div>
  </div>
  <div class="nav-actions">
    <a href="/login" class="btn-outline">Đăng nhập</a>
    <a href="/register" class="btn-primary">Đăng ký miễn phí →</a>
  </div>
</nav>
{% endblock %}

{% block content %}{% endblock %}

{% block footer %}
<footer class="landing-footer">
  © 2026 Programming EDU. All rights reserved.
</footer>
{% endblock %}

{% block extra_scripts %}{% endblock %}


</body>
</html>
