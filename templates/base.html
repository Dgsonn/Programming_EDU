<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Programming EDU{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}landing-body{% endblock %}">
<div class="bg-canvas">
  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <div class="bg-blob b3"></div>
  <div class="bg-blob b4"></div>
</div>
<div class="grid-overlay"></div>
<div class="particles" id="landingParticles">
  <span class="particle" style="left:10%; width:4px; height:4px; animation-duration:12s; animation-delay:-2s; background:#FFFFFF;"></span>
  <span class="particle" style="left:25%; width:3px; height:3px; animation-duration:10s; animation-delay:-5s; background:#EF5350;"></span>
  <span class="particle" style="left:40%; width:5px; height:5px; animation-duration:14s; animation-delay:-3s; background:#42A5F5;"></span>
  <span class="particle" style="left:60%; width:4px; height:4px; animation-duration:11s; animation-delay:-6s; background:#FF8A80;"></span>
  <span class="particle" style="left:78%; width:3px; height:3px; animation-duration:13s; animation-delay:-4s; background:#BBDEFB;"></span>
  <span class="particle" style="left:90%; width:5px; height:5px; animation-duration:16s; animation-delay:-8s; background:#FFFFFF;"></span>
</div>

{% block nav %}
<nav class="landing-nav">
  <div class="landing-logo">
    <div class="logo-line1"><span class="blue">Pro</span><span class="blue">gram</span><span class="red">ming</span></div>
    <div class="logo-line2"><span class="blue">E</span><span class="blue">D</span><span class="red">U</span></div>
  </div>
  <div class="nav-actions">
    <a href="/login" class="btn-outline">Đăng nhập</a>
    <a href="/register" class="btn-primary">Đăng ký miễn phí →</a>
  </div>
</nav>
{% endblock %}

{% block content %}{% endblock %}

{% block footer %}
<footer class="landing-footer">
  © 2026 Programming EDU. All rights reserved.
</footer>
{% endblock %}

{% block extra_scripts %}{% endblock %}

</body>
</html>
