<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token() }}" />
  <title>Concept Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* TRẢ-NỢ 2026-07-05 — concept card Option-2 (recommendation §5 Hybrid).
     * Trang tự chứa, cùng design system dark của lesson player. */
    :root { --cc-accent: #FB923C; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; background: #0B1121; color: #E2E8F0;
      font-family: 'Inter', sans-serif; line-height: 1.65;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 20px 64px;
    }
    .cc-top { width: 100%; max-width: 760px; margin-bottom: 14px; }
    .cc-back {
      color: #7f93ad; text-decoration: none; font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }
    .cc-back:hover { color: #e8edf5; }
    .cc-card {
      width: 100%; max-width: 760px;
      background: #0e1726; border: 1px solid rgba(148, 163, 184, .18);
      border-top: 3px solid var(--cc-accent);
      border-radius: 14px; padding: 34px 38px;
    }
    .cc-eyebrow {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: .16em; color: var(--cc-accent); margin-bottom: 10px;
    }
    .cc-title { font-size: 27px; font-weight: 800; color: #F1F5F9; text-wrap: balance; margin-bottom: 10px; }
    .cc-intro { color: #aebfd6; font-size: 15px; margin-bottom: 6px; }
    .cc-section { margin-top: 22px; }
    .cc-section h2 {
      font-size: 15px; font-weight: 700; color: #e8edf5; margin-bottom: 6px;
      display: flex; align-items: center; gap: 9px;
    }
    .cc-section h2 i { color: var(--cc-accent); font-size: 14px; width: 18px; text-align: center; }
    .cc-section p { color: #aebfd6; font-size: 14.5px; }
    .cc-card code {
      font-family: 'JetBrains Mono', monospace; font-size: .92em;
      color: #fbbf24; background: rgba(251, 191, 36, .08);
      padding: 1px 5px; border-radius: 4px;
    }
    .cc-source {
      margin-top: 26px; padding: 10px 14px; border-radius: 8px;
      background: rgba(148, 163, 184, .06); border-left: 3px solid rgba(148, 163, 184, .35);
      font-size: 12.5px; color: #7f93ad; font-family: 'JetBrains Mono', monospace;
    }
    .cc-cta {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 26px; padding: 12px 22px; border-radius: 10px;
      background: var(--cc-accent); color: #0B1121; font-weight: 800; font-size: 15px;
      text-decoration: none; transition: transform .15s ease, filter .15s ease;
    }
    .cc-cta:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .cc-cta:focus-visible { outline: 2px solid #06B6D4; outline-offset: 3px; }
    .cc-missing {
      max-width: 560px; margin-top: 15vh; text-align: center; color: #aebfd6;
      font-family: 'JetBrains Mono', monospace;
    }
    @media (max-width: 640px) { .cc-card { padding: 26px 20px; } .cc-title { font-size: 22px; } }
    @media (prefers-reduced-motion: reduce) { .cc-cta { transition: none; } }
  </style>
</head>
<body data-card-id="{{ card_id }}">
  <div class="cc-top"><a class="cc-back" href="/courses/db_design_tc">← Về roadmap khóa học</a></div>
  <main id="card-root"><div class="cc-missing">Đang mở hồ sơ…</div></main>

  <script src="{{ url_for('static', filename='js/lesson_content_tc.js') }}"></script>
  <script>
    (function () {
      var id = document.body.getAttribute('data-card-id');
      var card = null;
      var courses = window.LESSON_CONTENT || {};
      Object.keys(courses).forEach(function (k) {
        ((courses[k] && courses[k].concept_cards) || []).forEach(function (c) {
          if (c.id === id) card = c;
        });
      });
      var root = document.getElementById('card-root');
      if (!card) {
        root.innerHTML = '<div class="cc-missing">Không tìm thấy hồ sơ <code>' +
          String(id).replace(/[<>&]/g, '') + '</code>.<br><br><a class="cc-back" href="/courses/db_design_tc">← Về roadmap</a></div>';
        return;
      }
      document.title = card.title + ' — Concept Card';
      if (card.accent) document.documentElement.style.setProperty('--cc-accent', card.accent);
      root.innerHTML =
        '<article class="cc-card">' +
          '<div class="cc-eyebrow">' + (card.eyebrow || 'CONCEPT CARD') + '</div>' +
          '<h1 class="cc-title">' + card.title + '</h1>' +
          (card.intro ? '<p class="cc-intro">' + card.intro + '</p>' : '') +
          (card.sections || []).map(function (s) {
            return '<section class="cc-section"><h2><i class="fa-solid ' + (s.icon || 'fa-circle-info') + '"></i>' +
              s.heading + '</h2><p>' + s.body + '</p></section>';
          }).join('') +
          (card.source ? '<div class="cc-source">📖 ' + card.source + '</div>' : '') +
          (card.cta ? '<a class="cc-cta" href="' + card.cta.href + '">' + card.cta.label + ' <i class="fa-solid fa-arrow-right"></i></a>' : '') +
        '</article>';
    })();
  </script>
</body>
</html>
