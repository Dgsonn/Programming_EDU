<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token() }}" />
  <title>Concept Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* TRẢ-NỢ 2026-07-05 — concept card Option-2 (recommendation §5 Hybrid).
     * Trang tự chứa, cùng design system dark của lesson player. */
    :root { --cc-accent: #FB923C; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; background: #0B1121; color: #E2E8F0;
      font-family: 'Inter', sans-serif; line-height: 1.65;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 20px 64px;
    }
    .cc-top { width: 100%; max-width: 760px; margin-bottom: 14px; }
    .cc-back {
      color: #7f93ad; text-decoration: none; font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }
    .cc-back:hover { color: #e8edf5; }
    .cc-card {
      width: 100%; max-width: 760px;
      background: #0e1726; border: 1px solid rgba(148, 163, 184, .18);
      border-top: 3px solid var(--cc-accent);
      border-radius: 14px; padding: 34px 38px;
    }
    .cc-eyebrow {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: .16em; color: var(--cc-accent); margin-bottom: 10px;
    }
    .cc-title { font-size: 27px; font-weight: 800; color: #F1F5F9; text-wrap: balance; margin-bottom: 10px; }
    .cc-intro { color: #aebfd6; font-size: 15px; margin-bottom: 6px; }
    .cc-section { margin-top: 22px; }
    .cc-section h2 {
      font-size: 15px; font-weight: 700; color: #e8edf5; margin-bottom: 6px;
      display: flex; align-items: center; gap: 9px;
    }
    .cc-section h2 i { color: var(--cc-accent); font-size: 14px; width: 18px; text-align: center; }
    .cc-section p { color: #aebfd6; font-size: 14.5px; }
    .cc-card code {
      font-family: 'JetBrains Mono', monospace; font-size: .92em;
      color: #fbbf24; background: rgba(251, 191, 36, .08);
      padding: 1px 5px; border-radius: 4px;
    }
    .cc-source {
      margin-top: 26px; padding: 10px 14px; border-radius: 8px;
      background: rgba(148, 163, 184, .06); border-left: 3px solid rgba(148, 163, 184, .35);
      font-size: 12.5px; color: #7f93ad; font-family: 'JetBrains Mono', monospace;
    }
    .cc-cta {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 26px; padding: 12px 22px; border-radius: 10px;
      background: var(--cc-accent); color: #0B1121; font-weight: 800; font-size: 15px;
      text-decoration: none; transition: transform .15s ease, filter .15s ease;
    }
    .cc-cta:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .cc-cta:focus-visible { outline: 2px solid #06B6D4; outline-offset: 3px; }
    .cc-missing {
      max-width: 560px; margin-top: 15vh; text-align: center; color: #aebfd6;
      font-family: 'JetBrains Mono', monospace;
    }
    /* NC 2026-07-05 — micro quiz (PART_6: mỗi card = 1 visual + ≤4 dòng + 1 quiz + feedback).
     * Client-side thuần, chọn 1 phát là khóa; không chấm vào progress (stateless như cả trang). */
    .cc-quiz { margin-top: 26px; padding-top: 20px; border-top: 1px dashed rgba(148, 163, 184, .25); }
    .cc-quiz-label {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: .16em; color: var(--cc-accent); margin-bottom: 8px;
    }
    .cc-quiz-q { font-size: 15px; font-weight: 700; color: #e8edf5; margin-bottom: 12px; }
    .cc-quiz-opt {
      display: block; width: 100%; text-align: left; cursor: pointer;
      margin-bottom: 8px; padding: 11px 14px; border-radius: 9px;
      background: rgba(148, 163, 184, .06); border: 1px solid rgba(148, 163, 184, .22);
      color: #cbd5e1; font-family: 'Inter', sans-serif; font-size: 14px;
      transition: border-color .15s ease, background .15s ease;
    }
    .cc-quiz-opt:hover:not(:disabled) { border-color: var(--cc-accent); background: rgba(148, 163, 184, .1); }
    .cc-quiz-opt:focus-visible { outline: 2px solid #06B6D4; outline-offset: 2px; }
    .cc-quiz-opt:disabled { cursor: default; opacity: .55; }
    .cc-quiz-opt.correct { border-color: #34D399; background: rgba(52, 211, 153, .12); color: #d1fae5; opacity: 1; }
    .cc-quiz-opt.wrong { border-color: #F87171; background: rgba(248, 113, 113, .12); color: #fee2e2; opacity: 1; }
    .cc-quiz-feedback { margin-top: 10px; font-size: 14px; padding: 11px 14px; border-radius: 9px; display: none; }
    .cc-quiz-feedback.ok { display: block; background: rgba(52, 211, 153, .1); border-left: 3px solid #34D399; color: #d1fae5; }
    .cc-quiz-feedback.ko { display: block; background: rgba(248, 113, 113, .1); border-left: 3px solid #F87171; color: #fee2e2; }
    @media (max-width: 640px) { .cc-card { padding: 26px 20px; } .cc-title { font-size: 22px; } }
    @media (prefers-reduced-motion: reduce) { .cc-cta, .cc-quiz-opt { transition: none; } }
  </style>
</head>
<body data-card-id="{{ card_id }}">
  <div class="cc-top"><a class="cc-back" id="cc-back-link" href="/courses/db_design_tc">← Về roadmap khóa học</a></div>
  <main id="card-root"><div class="cc-missing">Đang mở hồ sơ…</div></main>

  <script src="{{ url_for('static', filename='js/lesson_content_tc.js') }}"></script>
  <script src="{{ url_for('static', filename='js/lesson_content_nc.js') }}"></script>
  <script>
    (function () {
      var id = document.body.getAttribute('data-card-id');
      var card = null;
      var courses = window.LESSON_CONTENT || {};
      Object.keys(courses).forEach(function (k) {
        ((courses[k] && courses[k].concept_cards) || []).forEach(function (c) {
          if (c.id === id) card = c;
        });
      });
      var root = document.getElementById('card-root');
      if (!card) {
        root.innerHTML = '<div class="cc-missing">Không tìm thấy hồ sơ <code>' +
          String(id).replace(/[<>&]/g, '') + '</code>.<br><br><a class="cc-back" href="/courses/db_design_tc">← Về roadmap</a></div>';
        return;
      }
      document.title = card.title + ' — Concept Card';
      if (card.accent) document.documentElement.style.setProperty('--cc-accent', card.accent);
      // NC: card thuộc khóa nào thì link "về roadmap" trỏ khóa đó (trước hardcode TC)
      if (card.back_href) document.getElementById('cc-back-link').setAttribute('href', card.back_href);
      root.innerHTML =
        '<article class="cc-card">' +
          '<div class="cc-eyebrow">' + (card.eyebrow || 'CONCEPT CARD') + '</div>' +
          '<h1 class="cc-title">' + card.title + '</h1>' +
          (card.intro ? '<p class="cc-intro">' + card.intro + '</p>' : '') +
          (card.sections || []).map(function (s) {
            return '<section class="cc-section"><h2><i class="fa-solid ' + (s.icon || 'fa-circle-info') + '"></i>' +
              s.heading + '</h2><p>' + s.body + '</p></section>';
          }).join('') +
          renderQuiz(card.quiz) +
          (card.source ? '<div class="cc-source">📖 ' + card.source + '</div>' : '') +
          (card.cta ? '<a class="cc-cta" href="' + card.cta.href + '">' + card.cta.label + ' <i class="fa-solid fa-arrow-right"></i></a>' : '') +
        '</article>';

      // Micro quiz (PART_6 format) — 1 câu, chọn là khóa, feedback tại chỗ
      function renderQuiz(quiz) {
        if (!quiz || !quiz.options || !quiz.options.length) return '';
        return '<div class="cc-quiz"><div class="cc-quiz-label">⚡ KIỂM TRA 10 GIÂY</div>' +
          '<div class="cc-quiz-q">' + escapeText(quiz.question) + '</div>' +
          quiz.options.map(function (o, i) {
            return '<button type="button" class="cc-quiz-opt" data-opt="' + i + '">' + escapeText(o.label) + '</button>';
          }).join('') +
          '<div class="cc-quiz-feedback" id="cc-quiz-feedback"></div></div>';
      }
      function escapeText(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      if (card.quiz && card.quiz.options) {
        var locked = false;
        root.querySelectorAll('.cc-quiz-opt').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (locked) return;
            locked = true;
            var opt = card.quiz.options[parseInt(btn.getAttribute('data-opt'), 10)];
            var fb = document.getElementById('cc-quiz-feedback');
            root.querySelectorAll('.cc-quiz-opt').forEach(function (b) {
              b.disabled = true;
              var o = card.quiz.options[parseInt(b.getAttribute('data-opt'), 10)];
              if (o && o.correct) b.classList.add('correct');
            });
            if (!opt.correct) btn.classList.add('wrong');
            fb.textContent = opt.feedback || (opt.correct ? '✓ Chính xác!' : '✗ Chưa đúng — đáp án đúng đã được tô xanh.');
            fb.className = 'cc-quiz-feedback ' + (opt.correct ? 'ok' : 'ko');
          });
        });
      }
    })();
  </script>
</body>
</html>
