<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Machine Learning">
  <defs>
    <linearGradient id="mlbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#mlbg)"/>
  <!-- scatter + đường hồi quy -->
  <g opacity="0.9">
    <line x1="60" y1="185" x2="340" y2="70" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/>
    <circle cx="85"  cy="172" r="5" fill="#C4B5FD"/>
    <circle cx="120" cy="168" r="5" fill="#C4B5FD"/>
    <circle cx="150" cy="140" r="5" fill="#C4B5FD"/>
    <circle cx="185" cy="150" r="5" fill="#C4B5FD"/>
    <circle cx="215" cy="118" r="5" fill="#C4B5FD"/>
    <circle cx="250" cy="122" r="5" fill="#C4B5FD"/>
    <circle cx="280" cy="95"  r="5" fill="#C4B5FD"/>
    <circle cx="315" cy="88"  r="5" fill="#C4B5FD"/>
  </g>
  <!-- mạng node nhỏ góc phải trên -->
  <g stroke="#8B5CF6" stroke-width="1.6" opacity="0.85">
    <line x1="300" y1="38" x2="336" y2="24"/>
    <line x1="300" y1="38" x2="336" y2="52"/>
    <line x1="336" y1="24" x2="368" y2="38"/>
    <line x1="336" y1="52" x2="368" y2="38"/>
  </g>
  <g fill="#EDE9FE">
    <circle cx="300" cy="38" r="6"/>
    <circle cx="336" cy="24" r="6"/>
    <circle cx="336" cy="52" r="6"/>
    <circle cx="368" cy="38" r="6"/>
  </g>
  <!-- trục -->
  <g stroke="#6D28D9" stroke-width="2" opacity="0.8">
    <line x1="55" y1="40" x2="55" y2="200"/>
    <line x1="55" y1="200" x2="355" y2="200"/>
  </g>
</svg>
