<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="gnc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#3b1d0e"/>
    </linearGradient>
    <pattern id="dotsnc" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#gnc)"/>
  <rect width="600" height="400" fill="url(#dotsnc)"/>
  <!-- Engine room — bánh răng lớn (GameHub Marketplace: bên trong cỗ máy giao dịch) -->
  <g stroke="#FB923C" fill="none" opacity="0.95">
    <circle cx="270" cy="180" r="58" stroke-width="4"/>
    <circle cx="270" cy="180" r="20" stroke-width="3.5"/>
    <g stroke-width="9" stroke-linecap="round">
      <line x1="270" y1="108" x2="270" y2="94"/>
      <line x1="270" y1="252" x2="270" y2="266"/>
      <line x1="198" y1="180" x2="184" y2="180"/>
      <line x1="342" y1="180" x2="356" y2="180"/>
      <line x1="219" y1="129" x2="209" y2="119"/>
      <line x1="321" y1="231" x2="331" y2="241"/>
      <line x1="219" y1="231" x2="209" y2="241"/>
      <line x1="321" y1="129" x2="331" y2="119"/>
    </g>
  </g>
  <!-- bánh răng nhỏ ăn khớp -->
  <g stroke="#FDBA74" fill="none" opacity="0.8">
    <circle cx="404" cy="120" r="34" stroke-width="3"/>
    <circle cx="404" cy="120" r="12" stroke-width="2.5"/>
    <g stroke-width="6" stroke-linecap="round">
      <line x1="404" y1="78"  x2="404" y2="68"/>
      <line x1="404" y1="162" x2="404" y2="172"/>
      <line x1="362" y1="120" x2="352" y2="120"/>
      <line x1="446" y1="120" x2="456" y2="120"/>
    </g>
  </g>
  <!-- tia sét hiệu năng -->
  <path d="M 420 220 l -26 44 h 20 l -12 40 l 40 -54 h -20 l 14 -30 z" fill="#FBBF24" opacity="0.9"/>
  <!-- khiên giao dịch an toàn -->
  <path d="M 158 236 l 30 12 v 26 c 0 18 -13 30 -30 38 c -17 -8 -30 -20 -30 -38 v -26 z" fill="none" stroke="#FDBA74" stroke-width="3" opacity="0.75"/>
  <path d="M 146 272 l 9 9 l 17 -19" fill="none" stroke="#FDBA74" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
</svg>
